<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel de Feedback — Customer Success</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root{
    --ink:#12161d;
    --surface:#191f29;
    --surface2:#232b37;
    --line:#2c3542;
    --text:#e7ecf3;
    --muted:#8b96a8;
    --accent:#e0623a;
    --accent-dim:rgba(224,98,58,0.15);
    --good:#4bab7c;
    --good-dim:rgba(75,171,124,0.15);
    --warn:#e0a83a;
    --warn-dim:rgba(224,168,58,0.15);
    --bad:#d9524a;
    --bad-dim:rgba(217,82,74,0.15);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    padding:28px;
    min-height:100vh;
  }
  .wrap{max-width:1280px; margin:0 auto;}

  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:24px; flex-wrap:wrap; gap:16px;
  }
  .title-block h1{
    font-size:22px; font-weight:600; letter-spacing:-0.01em;
  }
  .live-row{
    display:flex; align-items:center; gap:8px; margin-top:6px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted);
  }
  .dot{
    width:8px; height:8px; border-radius:50%; background:var(--good);
    box-shadow:0 0 0 0 rgba(75,171,124,0.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(75,171,124,0.5);}
    70%{box-shadow:0 0 0 8px rgba(75,171,124,0);}
    100%{box-shadow:0 0 0 0 rgba(75,171,124,0);}
  }
  .controls{display:flex; gap:10px; align-items:center;}
  select, button{
    background:var(--surface2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:8px 12px; font-family:'IBM Plex Sans',sans-serif;
    font-size:13px; cursor:pointer;
  }
  button:hover{border-color:var(--accent);}
  button:disabled{opacity:.5; cursor:default;}

  .kpi-row{
    display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:20px;
  }
  .kpi{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px;
  }
  .kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
  .kpi .value{
    font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:600; margin-top:6px;
  }
  .kpi .sub{font-size:12px; color:var(--muted); margin-top:4px;}
  .kpi.accent .value{color:var(--accent);}
  .kpi.good .value{color:var(--good);}

  .gauge-wrap{grid-column:span 1; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .gauge-wrap svg{width:150px; height:90px;}
  .gauge-val{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; margin-top:-38px;}
  .gauge-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-top:4px;}

  .main-grid{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
  @media (max-width:900px){ .main-grid{grid-template-columns:1fr;} .kpi-row{grid-template-columns:repeat(2,1fr);} }
  @media (min-width:901px) and (max-width:1150px){ .kpi-row{grid-template-columns:repeat(3,1fr);} }

  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:18px 20px;
  }
  .panel h2{
    font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;
  }
  .panel h2 .count{
    font-family:'IBM Plex Mono',monospace; color:var(--text); background:var(--surface2);
    padding:2px 8px; border-radius:20px; font-size:11px;
  }

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); padding:8px 6px; border-bottom:1px solid var(--line); font-weight:500;
  }
  td{padding:10px 6px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .cliente{font-weight:600;}
  .empresa{color:var(--muted); font-size:12px;}
  .badge{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px;
    font-family:'IBM Plex Mono',monospace; font-weight:600;
  }
  .badge.critica, .badge.alta{background:var(--bad-dim); color:var(--bad);}
  .badge.media{background:var(--warn-dim); color:var(--warn);}
  .badge.baixa{background:var(--good-dim); color:var(--good);}
  .score-cell{font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .score-cell.crit{color:var(--bad);}
  .score-cell.mid{color:var(--warn);}
  .score-cell.ok{color:var(--good);}

  .charts-col{display:flex; flex-direction:column; gap:16px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12px;}
  .bar-label{width:70px; color:var(--muted); flex-shrink:0;}
  .bar-track{flex:1; background:var(--surface2); border-radius:4px; height:16px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:4px;}
  .bar-count{width:26px; text-align:right; font-family:'IBM Plex Mono',monospace; color:var(--muted); flex-shrink:0;}

  .donut-wrap{display:flex; align-items:center; gap:20px;}
  .legend{display:flex; flex-direction:column; gap:8px; font-size:12px;}
  .legend-item{display:flex; align-items:center; gap:8px;}
  .legend-dot{width:10px; height:10px; border-radius:3px;}

  .empty{color:var(--muted); font-size:13px; padding:30px 0; text-align:center;}
  .err{
    background:var(--bad-dim); border:1px solid var(--bad); color:var(--bad);
    border-radius:8px; padding:14px 16px; font-size:13px; line-height:1.5; margin-bottom:20px;
  }
  .err code{background:rgba(0,0,0,.25); padding:1px 5px; border-radius:4px; font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <h1>Painel de Feedback — Customer Success</h1>
      <div class="live-row"><span class="dot" id="liveDot"></span><span id="statusText">conectando…</span></div>
    </div>
    <div class="controls">
      <input type="date" id="dateFrom" title="De">
      <input type="date" id="dateTo" title="Até">
      <select id="statusFilter">
        <option value="all">Todos os status</option>
        <option value="Nova solicitação">Nova solicitação</option>
        <option value="Em análise">Em análise</option>
        <option value="Resolvido">Resolvido</option>
      </select>
      <button id="refreshBtn">↻ Atualizar</button>
    </div>
  </header>

  <div id="errBox"></div>

  <div class="kpi-row" id="kpiRow">
    <div class="kpi"><div class="label">Total de feedbacks</div><div class="value" id="kpiTotal">—</div><div class="sub" id="kpiTotalSub">&nbsp;</div></div>
    <div class="kpi accent"><div class="label">Urgência alta/crítica</div><div class="value" id="kpiUrgent">—</div><div class="sub" id="kpiUrgentSub">&nbsp;</div></div>
    <div class="kpi"><div class="label">Risco de churn alto</div><div class="value" id="kpiChurn">—</div><div class="sub" id="kpiChurnSub">&nbsp;</div></div>
    <div class="kpi good"><div class="label">Resolvidos</div><div class="value" id="kpiResolved">—</div><div class="sub" id="kpiResolvedSub">&nbsp;</div></div>
    <div class="kpi gauge-wrap">
      <svg viewBox="0 0 150 90">
        <path d="M15 85 A60 60 0 0 1 135 85" fill="none" stroke="var(--surface2)" stroke-width="12" stroke-linecap="round"/>
        <path id="gaugeArc" d="M15 85 A60 60 0 0 1 135 85" fill="none" stroke="var(--good)" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 1000"/>
      </svg>
      <div class="gauge-val" id="kpiScore">—</div>
      <div class="gauge-label">Score de saúde médio</div>
    </div>
  </div>

  <div class="main-grid">
    <div class="panel">
      <h2>Fila de atenção <span class="count" id="filaCount">0</span></h2>
      <table>
        <thead>
          <tr><th>Cliente</th><th>Data</th><th>Tipo</th><th>Urgência</th><th>Score</th><th>Status</th></tr>
        </thead>
        <tbody id="filaBody"></tbody>
      </table>
      <div class="empty" id="filaEmpty" style="display:none;">Nenhum registro para esse filtro.</div>
    </div>

    <div class="charts-col">
      <div class="panel">
        <h2>Sentimento</h2>
        <div class="donut-wrap">
          <svg viewBox="0 0 42 42" width="120" height="120" id="donutSvg"></svg>
          <div class="legend" id="donutLegend"></div>
        </div>
      </div>
      <div class="panel">
        <h2>Distribuição de urgência</h2>
        <div id="urgBars"></div>
      </div>
    </div>
  </div>

</div>

<script>
// Configurável via URL: ?sheetId=SEU_ID&gid=SEU_GID
// Sem parâmetros, usa a planilha de demonstração (dados fictícios) como exemplo.
const params = new URLSearchParams(window.location.search);
const SHEET_ID = params.get("sheetId") || "1jDIU8GnfwWpjbiRIsx7TnikScby-nckpmyfpTqe38e4";
const SHEET_GID = params.get("gid") || "845579486";

let rows = [];
let statusFilter = "all";
let jsonpCounter = 0;

function normKey(k){
  return k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}

// Nomes possíveis para a coluna de data/hora, cobrindo tanto o padrão do
// Google Forms em português ("Carimbo de data/hora") quanto em inglês
// ("Timestamp") — evita quebrar o dashboard se o nome da coluna mudar.
const CANDIDATOS_COLUNA_DATA = ["timestamp", "carimbodedatahora", "data", "datahora"];

function detectarColunaData(headers){
  return CANDIDATOS_COLUNA_DATA.find(c => headers.includes(c)) || null;
}

function gvizToObjects(table){
  const headers = table.cols.map(c => normKey(c.label || ""));
  const colunaData = detectarColunaData(headers);
  return table.rows
    .filter(r => r.c && r.c.some(cell => cell && cell.v !== null && cell.v !== ""))
    .map(r => {
      const o = {};
      headers.forEach((h,i) => {
        const cell = r.c[i];
        if(!cell || cell.v === null || cell.v === undefined){ o[h] = ""; return; }
        if(typeof cell.v === "string" && cell.v.indexOf("Date(") === 0){
          const nums = cell.v.slice(5,-1).split(",").map(Number);
          const d = new Date(nums[0], nums[1], nums[2], nums[3]||0, nums[4]||0, nums[5]||0);
          o[h] = d.toISOString();
          o[h+"_fmt"] = cell.f || d.toLocaleString('pt-BR');
        } else {
          o[h] = String(cell.v);
        }
      });
      // Garante que o resto do código sempre encontre a data em "timestamp",
      // independente de qual nome de coluna foi detectado na planilha.
      if(colunaData && colunaData !== "timestamp"){
        o.timestamp = o[colunaData];
        o.timestamp_fmt = o[colunaData + "_fmt"];
      }
      return o;
    });
}

function fetchViaJsonp(){
  return new Promise((resolve, reject) => {
    window.google = window.google || {};
    window.google.visualization = window.google.visualization || {};
    window.google.visualization.Query = window.google.visualization.Query || {};
    const script = document.createElement('script');
    const timeout = setTimeout(() => { cleanup(); reject(new Error("tempo esgotado")); }, 10000);
    function cleanup(){
      clearTimeout(timeout);
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    window.google.visualization.Query.setResponse = (json) => { cleanup(); resolve(json); };
    script.onerror = () => { cleanup(); reject(new Error("não foi possível carregar o script")); };
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}&_=${Date.now()}`;
    document.head.appendChild(script);
  });
}

function urgClass(u){
  u = (u||"").toLowerCase();
  if(u === "critica" || u === "alta") return "critica";
  if(u === "media") return "media";
  return "baixa";
}
function scoreClass(s){
  if(s < 40) return "crit";
  if(s < 70) return "mid";
  return "ok";
}

async function loadData(){
  const dot = document.getElementById('liveDot');
  const statusText = document.getElementById('statusText');
  const errBox = document.getElementById('errBox');
  document.getElementById('refreshBtn').disabled = true;
  try{
    const json = await fetchViaJsonp();
    if(!json.table) throw new Error("resposta sem tabela — confira o nome da aba");
    rows = gvizToObjects(json.table);
    errBox.innerHTML = "";
    dot.style.background = "var(--good)";
    const now = new Date();
    statusText.textContent = "ao vivo · última atualização " + now.toLocaleTimeString('pt-BR');
    render();
  }catch(e){
    dot.style.background = "var(--bad)";
    statusText.textContent = "falha ao conectar";
    errBox.innerHTML = `<div class="err">
      Não consegui buscar os dados da planilha. Confirme que ela está compartilhada como
      <code>Qualquer pessoa com o link · Leitor</code> em Compartilhar → Acesso geral, e clique em Atualizar.
      <br>Detalhe técnico: ${e.message}
    </div>`;
  }
  document.getElementById('refreshBtn').disabled = false;
}

function render(){
  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;

  let filtered = statusFilter === "all" ? rows.slice() : rows.filter(r => (r.status||"") === statusFilter);

  if(dateFrom){
    const from = new Date(dateFrom + "T00:00:00");
    filtered = filtered.filter(r => r.timestamp && new Date(r.timestamp) >= from);
  }
  if(dateTo){
    const to = new Date(dateTo + "T23:59:59");
    filtered = filtered.filter(r => r.timestamp && new Date(r.timestamp) <= to);
  }

  // KPIs
  const total = filtered.length;
  const urgent = filtered.filter(r => ["alta","critica"].includes((r.urgencia||"").toLowerCase()));
  const churnAlto = filtered.filter(r => (r.riscodechurn||"").toLowerCase() === "alto");
  const resolved = filtered.filter(r => (r.status||"") === "Resolvido");
  const scores = filtered.map(r => parseFloat(r.scoredesaude)).filter(n => !isNaN(n));
  const avgScore = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;

  document.getElementById('kpiTotal').textContent = total;
  document.getElementById('kpiTotalSub').textContent = statusFilter === "all" ? "todos os status" : statusFilter;
  document.getElementById('kpiUrgent').textContent = urgent.length;
  document.getElementById('kpiUrgentSub').textContent = total ? Math.round(urgent.length/total*100)+"% do total" : "\u00A0";
  document.getElementById('kpiChurn').textContent = churnAlto.length;
  document.getElementById('kpiChurnSub').textContent = total ? Math.round(churnAlto.length/total*100)+"% do total" : "\u00A0";
  document.getElementById('kpiResolved').textContent = resolved.length;
  document.getElementById('kpiResolvedSub').textContent = total ? Math.round(resolved.length/total*100)+"% do total" : "\u00A0";
  document.getElementById('kpiScore').textContent = scores.length ? avgScore : "—";

  const gaugeColor = avgScore < 40 ? "var(--bad)" : avgScore < 70 ? "var(--warn)" : "var(--good)";
  const arc = document.getElementById('gaugeArc');
  arc.setAttribute('stroke', gaugeColor);
  const circumference = 188.5; // approx half-circle length for r=60
  const pct = Math.max(0, Math.min(100, avgScore)) / 100;
  arc.setAttribute('stroke-dasharray', `${pct*circumference} ${circumference}`);

  // Fila de atenção: sorted by score asc, excluding resolved unless filter explicitly asks for it
  let fila = filtered.slice();
  if(statusFilter === "all"){
    fila = fila.filter(r => (r.status||"") !== "Resolvido");
  }
  fila.sort((a,b) => (parseFloat(a.scoredesaude)||0) - (parseFloat(b.scoredesaude)||0));

  const tbody = document.getElementById('filaBody');
  tbody.innerHTML = "";
  document.getElementById('filaCount').textContent = fila.length;
  document.getElementById('filaEmpty').style.display = fila.length ? "none" : "block";

  fila.slice(0, 25).forEach(r => {
    const score = parseFloat(r.scoredesaude) || 0;
    const dataFmt = r.timestamp_fmt || (r.timestamp ? new Date(r.timestamp).toLocaleDateString('pt-BR') : '—');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><div class="cliente">${escapeHtml(r.nome||'—')}</div><div class="empresa">${escapeHtml(r.empresa||'')}</div></td>
      <td class="empresa">${escapeHtml(dataFmt)}</td>
      <td>${escapeHtml(r.tipodesolicitacao||'—')}</td>
      <td><span class="badge ${urgClass(r.urgencia)}">${escapeHtml(r.urgencia||'—')}</span></td>
      <td><span class="score-cell ${scoreClass(score)}">${score}</span></td>
      <td>${escapeHtml(r.status||'—')}</td>
    `;
    tbody.appendChild(tr);
  });

  // Donut de sentimento
  const sentCounts = {positivo:0, neutro:0, negativo:0};
  filtered.forEach(r => {
    const s = (r.sentimento||"").toLowerCase();
    if(sentCounts[s] !== undefined) sentCounts[s]++;
  });
  renderDonut(sentCounts);

  // Barras de urgência
  const urgCounts = {baixa:0, media:0, alta:0, critica:0};
  filtered.forEach(r => {
    const u = (r.urgencia||"").toLowerCase();
    if(urgCounts[u] !== undefined) urgCounts[u]++;
  });
  renderBars(urgCounts);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderDonut(counts){
  const colors = {positivo:'#4bab7c', neutro:'#8b96a8', negativo:'#d9524a'};
  const labels = {positivo:'Positivo', neutro:'Neutro', negativo:'Negativo'};
  const total = counts.positivo + counts.neutro + counts.negativo;
  const svg = document.getElementById('donutSvg');
  svg.innerHTML = "";
  let offset = 0;
  if(total === 0){
    svg.innerHTML = `<circle cx="21" cy="21" r="15.9" fill="none" stroke="#2c3542" stroke-width="6"/>`;
  } else {
    Object.keys(colors).forEach(key => {
      const val = counts[key];
      if(val === 0) return;
      const pct = val/total*100;
      const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
      circle.setAttribute("cx","21"); circle.setAttribute("cy","21"); circle.setAttribute("r","15.9");
      circle.setAttribute("fill","none"); circle.setAttribute("stroke",colors[key]);
      circle.setAttribute("stroke-width","6");
      circle.setAttribute("stroke-dasharray", `${pct} ${100-pct}`);
      circle.setAttribute("stroke-dashoffset", 25-offset);
      circle.setAttribute("transform","rotate(-90 21 21)");
      svg.appendChild(circle);
      offset += pct;
    });
  }
  const legend = document.getElementById('donutLegend');
  legend.innerHTML = Object.keys(colors).map(key => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${colors[key]}"></div>
      <span>${labels[key]} — ${counts[key]}</span>
    </div>
  `).join("");
}

function renderBars(counts){
  const colors = {baixa:'#4bab7c', media:'#e0a83a', alta:'#d9524a', critica:'#d9524a'};
  const labels = {baixa:'Baixa', media:'Média', alta:'Alta', critica:'Crítica'};
  const max = Math.max(1, ...Object.values(counts));
  const el = document.getElementById('urgBars');
  el.innerHTML = Object.keys(labels).map(key => `
    <div class="bar-row">
      <div class="bar-label">${labels[key]}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${counts[key]/max*100}%; background:${colors[key]}"></div></div>
      <div class="bar-count">${counts[key]}</div>
    </div>
  `).join("");
}

document.getElementById('statusFilter').addEventListener('change', e => {
  statusFilter = e.target.value;
  render();
});
document.getElementById('dateFrom').addEventListener('change', render);
document.getElementById('dateTo').addEventListener('change', render);
document.getElementById('refreshBtn').addEventListener('click', loadData);

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
